name: Godot 4.7.2 addon smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject unresolved merge markers in authored Godot assets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          corrupt = []
          for rel in paths:
              if not rel or pathlib.Path(rel).suffix not in {".tscn", ".tres", ".gd", ".cfg"}:
                  continue
              try:
                  lines = pathlib.Path(rel).read_text(encoding="utf-8").splitlines()
              except UnicodeError:
                  continue
              for number, line in enumerate(lines, 1):
                  if line.startswith(("<<<<<<< ", ">>>>>>> ", "=======")):
                      corrupt.append(f"{rel}:{number}: {line[:100]}")
          if corrupt:
              print("Unresolved merge conflict markers:\\n" + "\\n".join(corrupt))
              sys.exit(1)
          canonical = pathlib.Path("examples/dungeon_authoring.tscn").read_text()
          if canonical.count("[node name=") != 1 or "DungeonPreview" in canonical or "DungeonBake" in canonical:
              print("Canonical dungeon_authoring.tscn must be a single-node source-only scene; regenerate preview, do not commit baked nodes.")
              sys.exit(1)
          print("GODOT_ASSET_CONFLICT_GUARD: PASS")
          PY

      - name: Download pinned Godot 4.7.2 stable
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import and parse addon and test project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then exit 1; fi
      - name: Verify addon-only installation in a clean Godot project
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/room-creator-clean/addons
          cp -a addons/room_creator /tmp/room-creator-clean/addons/
          cat > /tmp/room-creator-clean/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Room Creator Clean Install"
          [editor_plugins]
          enabled=PackedStringArray("res://addons/room_creator/plugin.cfg")
          EOF
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/room-creator-clean --editor --quit 2>&1 | tee clean-install.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' clean-install.log; then exit 1; fi
      - name: Test geometry, validation, preservation, and export round-trip
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/room_creator_smoke.gd 2>&1 | tee test.log
          grep 'ROOM_CREATOR_SMOKE: PASS' test.log
          if grep -E 'SCRIPT ERROR|Parse Error|ROOM_CREATOR_SMOKE: FAIL' test.log; then exit 1; fi

      - name: Test F2 seeded topology, socket alignment and scene persistence
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_layout_smoke.gd 2>&1 | tee dungeon-test.log
          grep 'DUNGEON_LAYOUT_SMOKE: PASS' dungeon-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_LAYOUT_SMOKE: FAIL' dungeon-test.log; then exit 1; fi

      - name: Sweep a representative capsule through every dungeon door
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_capsule_smoke.gd 2>&1 | tee capsule.log
          grep 'DUNGEON_CAPSULE_SMOKE: PASS' capsule.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_CAPSULE_SMOKE: FAIL' capsule.log; then exit 1; fi

      - name: Validate silhouette variants and automatic preview lifecycle
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/room_shapes_smoke.gd 2>&1 | tee shapes.log
          grep 'ROOM_SHAPES_SMOKE: PASS' shapes.log
          if grep -E 'SCRIPT ERROR|Parse Error|ROOM_SHAPES_SMOKE: FAIL' shapes.log; then exit 1; fi

      - name: Test editor path colors and preview-only diagnostics
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_diagnostics_smoke.gd 2>&1 | tee diagnostics.log
          grep 'DUNGEON_DIAGNOSTICS_SMOKE: PASS' diagnostics.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_DIAGNOSTICS_SMOKE: FAIL' diagnostics.log; then exit 1; fi

      - name: Test variable-size corridors and exterior door capsule traversal
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_spatial_smoke.gd 2>&1 | tee spatial.log
          grep 'DUNGEON_SPATIAL_SMOKE: PASS' spatial.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_SPATIAL_SMOKE: FAIL' spatial.log; then exit 1; fi

      - name: Validate custom room modules and normalized socket alignment
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_module_smoke.gd 2>&1 | tee module.log
          grep 'DUNGEON_MODULE_SMOKE: PASS' module.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_MODULE_SMOKE: FAIL' module.log; then exit 1; fi

      - name: Exercise modular authoring in the actual Godot editor
        shell: bash
        run: |
          set -o pipefail
          cp project.godot /tmp/room-creator-editor-project.godot
          trap 'cp /tmp/room-creator-editor-project.godot project.godot' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          content = p.read_text()
          addon = 'res://addons/room_creator/plugin.cfg'
          smoke = 'res://tests/editor_integration/plugin.cfg'
          if 'enabled=PackedStringArray(' in content:
              content = content.replace(addon + '")', addon + '", "' + smoke + '")')
          else:
              content += '\n[editor_plugins]\nenabled=PackedStringArray("' + addon + '", "' + smoke + '")\n'
          p.write_text(content)
          PY
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit-after 600 2>&1 | tee editor-integration.log
          grep 'DUNGEON_EDITOR_INTEGRATION: PASS' editor-integration.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_EDITOR_INTEGRATION: FAIL|Attempting to parent and popup a dialog that already has a parent' editor-integration.log; then exit 1; fi

      - name: Exercise real graphical editor under a virtual X11 display
        shell: bash
        run: |
          set -o pipefail
          cp project.godot /tmp/room-creator-xvfb-project.godot
          trap 'cp /tmp/room-creator-xvfb-project.godot project.godot' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          content = p.read_text()
          addon = 'res://addons/room_creator/plugin.cfg'
          smoke = 'res://tests/editor_integration/plugin.cfg'
          if 'enabled=PackedStringArray(' in content:
              content = content.replace(addon + '")', addon + '", "' + smoke + '")')
          else:
              content += '\n[editor_plugins]\nenabled=PackedStringArray("' + addon + '", "' + smoke + '")\n'
          p.write_text(content)
          PY
          command -v xvfb-run
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1             ./Godot_v4.7.2-stable_linux.x86_64 --path . --editor             --rendering-method gl_compatibility --quit-after 600 2>&1 | tee editor-xvfb.log
          grep 'DUNGEON_EDITOR_INTEGRATION: PASS' editor-xvfb.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_EDITOR_INTEGRATION: FAIL|Attempting to parent and popup a dialog that already has a parent' editor-xvfb.log; then exit 1; fi

      - name: Test non-uniform spatial embedding and extended corridor physics
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_embedding_smoke.gd 2>&1 | tee embedding.log
          grep 'DUNGEON_EMBEDDING_SMOKE: PASS' embedding.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_EMBEDDING_SMOKE: FAIL' embedding.log; then exit 1; fi

      - name: Verify independently offset rooms and collision-free corridor solver
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/dungeon_offsets_smoke.gd 2>&1 | tee offsets.log
          grep 'DUNGEON_OFFSETS_SMOKE: PASS' offsets.log
          if grep -E 'SCRIPT ERROR|Parse Error|DUNGEON_OFFSETS_SMOKE: FAIL' offsets.log; then exit 1; fi
